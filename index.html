<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Beyond View</title>
<style>body{margin:0;background:#10131c;color:#f6f8fc;font:16px system-ui,sans-serif}header{padding:20px;border-bottom:1px solid #30384a;font-size:1.3rem;font-weight:800}header span{color:#8be9df}main{max-width:760px;margin:40px auto;padding:20px}.panel{padding:28px;border:1px solid #30384a;border-radius:20px;background:#191e2a}h1{font-size:clamp(2rem,7vw,4rem);line-height:1.05}p{color:#aab3c5;line-height:1.6}button,label{display:inline-block;background:#8be9df;color:#102326;border:0;border-radius:999px;padding:12px 18px;font-weight:700;cursor:pointer}input{display:block;margin-top:16px;max-width:100%}.note{margin-top:18px;padding:12px;border-radius:10px;background:#302719;color:#ffdc9b;font-size:.9rem}</style>
</head>
<body><header>Beyond <span>View</span></header><main><div class="panel"><p>DON'T JUST WATCH THE WORLD. ENTER IT.</p><h1>Watch the video.<br>Or enter its world.</h1><p>This is the first browser prototype for Beyond View. Choose a video from your device to preview it locally.</p><label for="video">Choose a video</label><input id="video" type="file" accept="video/*"><video id="player" controls playsinline style="display:none;width:100%;margin-top:20px"></video><p><button id="enter">ENTER 3D</button></p><div class="note" id="note">3D reconstruction is not connected yet. We will test a real sample 3D scene in a later step.</div></div></main><script>const input=document.getElementById('video'),player=document.getElementById('player');let url;input.addEventListener('change',()=>{if(!input.files[0])return;if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(input.files[0]);player.src=url;player.style.display='block';});document.getElementById('enter').addEventListener('click',()=>{document.getElementById('note').textContent='The 3D viewer is not connected yet. This button is a placeholder until a real reconstructed scene is integrated.';});</script></body></html>
