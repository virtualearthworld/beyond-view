<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Beyond View — Real 3D Asset Test</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#111;color:white;font:15px system-ui}#info{position:absolute;z-index:2;top:12px;left:12px;max-width:380px;background:#101820e8;padding:15px;border-radius:12px}#status{margin-top:8px;color:#bde9ff}a{color:#9fe7ff}canvas{display:block}button{padding:8px;margin-top:8px} </style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script></head><body><div id="info"><b>Beyond View — real 3D model test</b><div>Animated 3D city model (not converted from your video). Click scene, use W/A/S/D to move, mouse to look; Esc releases mouse. Arrow keys also move.</div><div id="status">Loading actual 3D model…</div><a href="./index.html">Back to app</a></div><script type="module">
import * as THREE from 'three';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';import {PointerLockControls} from 'three/addons/controls/PointerLockControls.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x8ebbd4);scene.fog=new THREE.Fog(0x8ebbd4,35,140);
const camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.05,500);camera.position.set(0,3,12);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.outputColorSpace=THREE.SRGBColorSpace;document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x445566,2));const sun=new THREE.DirectionalLight(0xffffff,2.5);sun.position.set(10,25,12);scene.add(sun);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(300,300),new THREE.MeshStandardMaterial({color:0x607d68}));ground.rotation.x=-Math.PI/2;ground.position.y=-.04;scene.add(ground);
const controls=new PointerLockControls(camera,document.body);renderer.domElement.addEventListener('click',()=>controls.lock());
const keys=new Set();addEventListener('keydown',e=>keys.add(e.code));addEventListener('keyup',e=>keys.delete(e.code));
const status=document.querySelector('#status');let mixer;
new GLTFLoader().load('https://threejs.org/examples/models/gltf/LittlestTokyo.glb',g=>{const model=g.scene;model.scale.setScalar(.02);model.position.set(0,0,0);scene.add(model);if(g.animations.length){mixer=new THREE.AnimationMixer(model);mixer.clipAction(g.animations[0]).play()}status.textContent='Real 3D model loaded. Click the scene to explore.'},p=>{if(p.total)status.textContent='Loading model: '+Math.round(100*p.loaded/p.total)+'%'},e=>{status.textContent='Model failed to load: '+e.message;console.error(e)});
const clock=new THREE.Clock();function loop(){requestAnimationFrame(loop);const dt=Math.min(clock.getDelta(),.05);if(mixer)mixer.update(dt);const speed=5*dt;if(keys.has('KeyW')||keys.has('ArrowUp'))controls.moveForward(speed);if(keys.has('KeyS')||keys.has('ArrowDown'))controls.moveForward(-speed);if(keys.has('KeyA')||keys.has('ArrowLeft'))controls.moveRight(-speed);if(keys.has('KeyD')||keys.has('ArrowRight'))controls.moveRight(speed);camera.position.y=3;renderer.render(scene,camera)}loop();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
