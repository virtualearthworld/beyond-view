<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Beyond View — 3D Sample Viewer</title>
  <meta name="description" content="A separate 3D model viewer test for Beyond View.">
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: #0b1020; color: #eef3ff; }
    body { display: grid; grid-template-rows: auto 1fr; overflow: hidden; }
    header { display:flex; align-items:center; justify-content:space-between; gap:16px; padding:14px 18px; background:#111a2b; border-bottom:1px solid #29364d; z-index:2; }
    .brand { font-weight:750; letter-spacing:.02em; }
    .sub { color:#aebbd1; font-size:12px; margin-top:3px; }
    .actions { display:flex; gap:8px; flex-wrap:wrap; }
    button, a { border:1px solid #435575; border-radius:9px; background:#1c2a42; color:#eef3ff; padding:9px 12px; font:inherit; font-size:13px; text-decoration:none; cursor:pointer; }
    button:hover, a:hover { background:#293c5b; }
    #viewport { position:relative; min-height:0; }
    canvas { display:block; width:100%; height:100%; }
    #status { position:absolute; left:16px; bottom:16px; max-width:min(560px,calc(100% - 32px)); padding:12px 14px; border:1px solid #344562; border-radius:12px; background:rgba(10,16,30,.88); color:#e9efff; font-size:13px; line-height:1.45; backdrop-filter:blur(10px); }
    #status strong { display:block; margin-bottom:3px; }
    #hint { position:absolute; right:16px; bottom:16px; max-width:260px; padding:10px 12px; border-radius:10px; background:rgba(10,16,30,.78); color:#b8c6dc; font-size:12px; line-height:1.5; pointer-events:none; }
    @media(max-width:600px) { header { align-items:flex-start; flex-direction:column; } .actions { width:100%; } #hint { display:none; } }
  </style>
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js" } }
  </script>
</head>
<body>
  <header>
    <div><div class="brand">BEYOND VIEW <span style="color:#82d7ff">/ 3D LAB</span></div><div class="sub">Isolated viewer test — separate from the video reconstruction pipeline</div></div>
    <div class="actions">
      <button id="reset">Reset view</button>
      <button id="spin">Auto-rotate: off</button>
      <a href="../index.html">Back to Beyond View</a>
    </div>
  </header>
  <main id="viewport">
    <div id="status"><strong>Preparing the 3D viewer…</strong>Loading the sample model. You can rotate, zoom, and pan when it appears.</div>
    <div id="hint">Drag: rotate<br>Scroll or pinch: zoom<br>Right-drag: pan</div>
  </main>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/controls/OrbitControls.js';
    import { GLTFLoader } from 'https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/loaders/GLTFLoader.js';

    const host = document.getElementById('viewport');
    const status = document.getElementById('status');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#0b1020');
    scene.fog = new THREE.Fog('#0b1020', 24, 85);

    const camera = new THREE.PerspectiveCamera(55, host.clientWidth / host.clientHeight, 0.1, 500);
    camera.position.set(7, 5, 10);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(host.clientWidth, host.clientHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    host.prepend(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.target.set(0, 1, 0);
    controls.minDistance = 1;
    controls.maxDistance = 90;

    scene.add(new THREE.HemisphereLight(0xc8ddff, 0x354057, 2.0));
    const key = new THREE.DirectionalLight(0xffffff, 3.0);
    key.position.set(7, 12, 8);
    scene.add(key);
    const fill = new THREE.DirectionalLight(0x7aaeff, 1.2);
    fill.position.set(-8, 4, -6);
    scene.add(fill);

    const floor = new THREE.Mesh(
      new THREE.PlaneGeometry(200, 200),
      new THREE.MeshStandardMaterial({ color: 0x18243a, roughness: 0.94, metalness: 0.02 })
    );
    floor.rotation.x = -Math.PI / 2;
    floor.position.y = -0.03;
    scene.add(floor);
    const grid = new THREE.GridHelper(100, 100, 0x526785, 0x293a55);
    grid.position.y = -0.015;
    scene.add(grid);

    let modelRoot = null;
    let autoRotate = false;
    let startPosition = new THREE.Vector3(7, 5, 10);
    let startTarget = new THREE.Vector3(0, 1, 0);

    function showStatus(title, message) {
      status.replaceChildren();
      const strong = document.createElement('strong');
      strong.textContent = title;
      const detail = document.createElement('span');
      detail.textContent = message;
      status.append(strong, detail);
    }

    const loader = new GLTFLoader();
    const sampleUrl = 'https://threejs.org/examples/models/gltf/LittlestTokyo.glb';
    loader.load(sampleUrl, (gltf) => {
      modelRoot = gltf.scene;
      modelRoot.updateMatrixWorld(true);
      const bounds = new THREE.Box3().setFromObject(modelRoot);
      const size = bounds.getSize(new THREE.Vector3());
      const center = bounds.getCenter(new THREE.Vector3());
      modelRoot.position.sub(center);
      modelRoot.position.y -= bounds.min.y - center.y;
      const maxDim = Math.max(size.x, size.y, size.z);
      const scale = maxDim > 12 ? 12 / maxDim : 1;
      modelRoot.scale.setScalar(scale);
      scene.add(modelRoot);

      const adjustedBounds = new THREE.Box3().setFromObject(modelRoot);
      const adjustedSize = adjustedBounds.getSize(new THREE.Vector3());
      const adjustedCenter = adjustedBounds.getCenter(new THREE.Vector3());
      controls.target.copy(adjustedCenter);
      const radius = Math.max(adjustedSize.x, adjustedSize.y, adjustedSize.z);
      camera.position.set(adjustedCenter.x + radius * 1.15, adjustedCenter.y + radius * 0.65, adjustedCenter.z + radius * 1.5);
      controls.minDistance = Math.max(0.2, radius * 0.12);
      controls.maxDistance = Math.max(25, radius * 8);
      controls.update();
      startPosition.copy(camera.position);
      startTarget.copy(controls.target);
      showStatus('3D model loaded', 'A real glTF model is now in the viewer. This confirms 3D display and navigation only; it is not yet a reconstruction of your uploaded video.');
    }, (event) => {
      if (event.total > 0) {
        const pct = Math.round(event.loaded / event.total * 100);
        showStatus('Loading sample 3D model', pct + '% downloaded');
      }
    }, (error) => {
      console.error('Sample model failed to load:', error);
      showStatus('The sample model could not load', 'Check your internet connection or whether the model host is reachable. The viewer itself loaded, but the external model did not.');
    });

    document.getElementById('reset').addEventListener('click', () => {
      camera.position.copy(startPosition);
      controls.target.copy(startTarget);
      controls.update();
    });
    document.getElementById('spin').addEventListener('click', (event) => {
      autoRotate = !autoRotate;
      controls.autoRotate = autoRotate;
      event.currentTarget.textContent = 'Auto-rotate: ' + (autoRotate ? 'on' : 'off');
    });

    function resize() {
      const width = host.clientWidth;
      const height = host.clientHeight;
      if (!width || !height) return;
      camera.aspect = width / height;
      camera.updateProjectionMatrix();
      renderer.setSize(width, height);
    }
    window.addEventListener('resize', resize);
    const observer = new ResizeObserver(resize);
    observer.observe(host);

    renderer.setAnimationLoop(() => {
      controls.update();
      renderer.render(scene, camera);
    });
  </script>
</body>
</html>
