name: Deploy Beyond View to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Verify Beyond View 3D workspace files
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path(".")
          home = (root / "index.html").read_text()
          workspace = root / "immersive-engine" / "index.html"
          assert 'src="./immersive-engine/sample-3d.html"' in home, "Beyond View iframe does not point to its in-page sample player"
          sample = root / "immersive-engine" / "sample-3d.html"
          assert sample.is_file() and sample.stat().st_size > 0, "In-page sample 3D player is missing"
          assert workspace.is_file() and workspace.stat().st_size > 0, "3D workspace index is missing"
          html = workspace.read_text()
          assets = re.findall(r'(?:src|href)="(/beyond-view/immersive-engine/[^"]+)"', html)
          required = [root / path.removeprefix("/beyond-view/") for path in assets]
          missing = [str(path) for path in required if not path.is_file() or path.stat().st_size == 0]
          if missing:
              raise SystemExit("3D workspace references missing files: " + ", ".join(missing))
          print(f"Verified 3D workspace index and {len(required)} referenced local assets.")
          PY
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
