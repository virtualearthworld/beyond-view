name: Deploy Beyond View to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Verify Beyond View pages and local navigation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          from urllib.parse import urlparse
          
          root = Path(".")
          required = [
              "index.html",
              "real-3d-test.html",
              "walkable-world.html",
              "photo-to-3d.html",
              "sample-video.html",
          ]
          missing = [name for name in required if not (root / name).is_file()]
          if missing:
              raise SystemExit("Required app pages are missing: " + ", ".join(missing))
          
          class LocalLinks(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.links = []
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  for key in ("href", "src"):
                      value = attrs.get(key, "")
                      if value.startswith("./") and value.lower().endswith((".html", ".js", ".css")):
                          self.links.append(value[2:].split("#")[0].split("?")[0])
          
          checked = 0
          for page in root.glob("*.html"):
              parser = LocalLinks()
              parser.feed(page.read_text())
              for link in parser.links:
                  if link and not (root / link).is_file():
                      raise SystemExit(f"{page}: local link points to missing file: {link}")
                  checked += 1
          print(f"Verified {len(required)} required pages and {checked} local HTML/JS/CSS links.")
          PY
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
