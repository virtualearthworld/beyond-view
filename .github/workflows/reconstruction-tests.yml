name: Reconstruction tests

on:
  push:
    paths:
      - "reconstruction/**"
      - "tests/**"
      - ".github/workflows/reconstruction-tests.yml"
  pull_request:
    paths:
      - "reconstruction/**"
      - "tests/**"
      - ".github/workflows/reconstruction-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run reconstruction regression tests
        run: |
          node --experimental-default-type=module tests/multiview-geometry.test.mjs
          node --experimental-default-type=module tests/sparse-reconstruction.test.mjs
          node --experimental-default-type=module tests/parallax-diagnostics.test.mjs
          node --experimental-default-type=module tests/epipolar-geometry.test.mjs
          node --experimental-default-type=module tests/camera-pose.test.mjs
          node --experimental-default-type=module tests/two-view-pipeline.test.mjs
          node --experimental-default-type=module tests/camera-trajectory.test.mjs
          node --experimental-default-type=module tests/reconstruction-lab.test.mjs
          node --experimental-default-type=module tests/trajectory-reconstruction.test.mjs
          node --experimental-default-type=module tests/sparse-cloud-view.test.mjs
